    <script>
      // Defensive guard for Chrome extensions attempting to monkey-patch window.fetch
      try {
        const _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
        let _activeFetch = _origFetch;
        if (_origFetch) {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() {
              return _activeFetch;
            },
            set(fn) {
              _activeFetch = fn;
            }
          });
        }
      } catch (e) {
        // Safe no-op
      }

      // Prevent third-party extension errors from triggering unhandled dialogs
      window.addEventListener('error', function(event) {
        if (event && event.filename && event.filename.startsWith('chrome-extension://')) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);
    </script>
