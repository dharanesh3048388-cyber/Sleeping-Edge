name: Deploy SleepingEdge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production website
        run: bun run build


      - name: Publish isolated static-site preview
        run: |
          set -euo pipefail
          mkdir -p dist/preview
          cp -R static-site/. dist/preview/
          rm -f dist/preview/robots.txt dist/preview/sitemap.xml dist/preview/_headers
          python3 scripts/prepare-pages-preview.py dist/preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
