name: Validate SleepingEdge static site

on:
  pull_request:
    paths:
      - "static-site/**"
      - "public/**"
      - "scripts/validate-production-readiness.py"
      - "scripts/prepare-google-integrations.py"
      - "src/**"
      - "tests/**"
      - "index.html"
      - "playwright.config.*"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - ".github/workflows/validate-static-preview.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the existing production app
        run: bun run build

      - name: Type-check the application
        run: bun run lint

      - name: Validate production SEO and monetization foundation
        run: python3 scripts/validate-production-readiness.py

      - name: Test optional Google integration preparation
        run: python3 scripts/prepare-google-integrations.py --self-test

      - name: Validate required pages and assets
        run: |
          set -euo pipefail
          test -s static-site/index.html
          test -s static-site/css/style.css
          test -s static-site/js/main.js
          test -s static-site/js/calculators.js
          for page in sleep-calculator caffeine-calculator nap-calculator sleep-debt-calculator sleep-stages about privacy terms contact; do
            test -s "static-site/$page/index.html"
          done

      - name: Guard against placeholders and unconfigured integrations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = list(Path("static-site").rglob("*.html"))
          assert len(pages) >= 9, f"Expected all core pages, found {len(pages)}"
          forbidden = [
              "YOURDOMAIN", "YOUR_FORMSPREE_ID", "B0XXXXXXXX",
              "YOUR_AMAZON_TAG", "CONTACT@YOURDOMAIN", "INSERT YOUR"
          ]
          for page in pages:
              content = page.read_text(encoding="utf-8")
              for marker in forbidden:
                  assert marker not in content, f"Placeholder {marker} remains in {page}"
              assert "plausible.io/js/script.js" not in content, f"Unconsented analytics script in {page}"
              assert not re.search(r"""class=["'][^"']*ad-slot""", content), f"Unconfigured ad slot in {page}"
              assert 'id="cookie-banner"' not in content, f"Inactive consent UI remains in {page}"
          contact = Path("static-site/contact/index.html").read_text(encoding="utf-8")
          assert "<form" not in contact.lower(), "Contact page must not expose an unconfigured form"
          print(f"Placeholder/integration guard passed for {len(pages)} pages.")
          PY

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check static-site/js/main.js
          node --check static-site/js/calculators.js

      - name: Check local HTML references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path("static-site")
          failures = []
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              # One capture group: each match is the referenced URL.
              for target in re.findall(r'''(?:href|src)=["'](/[^"'#?]*)["']''', html, flags=re.I):
                  rel = target.lstrip("/")
                  if not (root / rel).exists():
                      failures.append(f"{page}: unresolved root path {target}")
          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print("All root-relative local HTML references resolve within static-site.")
          PY

      - name: Smoke-test GitHub Pages preview packaging
        run: |
          set -euo pipefail
          mkdir -p dist/preview
          cp -R static-site/. dist/preview/
          rm -f dist/preview/robots.txt dist/preview/sitemap.xml dist/preview/_headers
          python3 scripts/prepare-pages-preview.py dist/preview
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("dist/preview")
          html_files = list(root.rglob("*.html"))
          assert html_files, "No preview HTML pages found"
          for page in html_files:
              content = page.read_text(encoding="utf-8")
              assert re.search(r'<meta name="robots" content="noindex,nofollow">', content), f"Missing noindex on {page}"
              for target in re.findall(r"""(?:href|src|action)=["'](/[^"'#?]*)["']""", content, flags=re.I):
                  assert target.startswith("/Sleeping-Edge/preview/"), f"Unprefixed root path in {page}: {target}"
          assert (root / "sleep-calculator/index.html").is_file(), "Sleep calculator page missing"
          assert not (root / "robots.txt").exists(), "Preview robots.txt should not be published"
          assert not (root / "sitemap.xml").exists(), "Preview sitemap.xml should not be published"
          print(f"Preview packaging smoke test passed for {len(html_files)} HTML pages.")
          PY

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked project dependencies
        run: bun install --frozen-lockfile

      - name: Build production website
        run: bun run build

      - name: Run deterministic calculator unit tests
        run: bun test tests/unit

      - name: Install isolated browser-test runner
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Package the static preview exactly as deployment does
        run: |
          set -euo pipefail
          mkdir -p dist/preview
          cp -R static-site/. dist/preview/
          rm -f dist/preview/robots.txt dist/preview/sitemap.xml dist/preview/_headers
          python3 scripts/prepare-pages-preview.py dist/preview

      - name: Serve production build and static preview
        run: |
          set -euo pipefail
          mkdir -p /tmp/sleepingedge-www/Sleeping-Edge
          cp -R dist/. /tmp/sleepingedge-www/Sleeping-Edge/
          python3 -m http.server 4173 --directory /tmp/sleepingedge-www > /tmp/sleepingedge-http.log 2>&1 &
          echo $! > /tmp/sleepingedge-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/Sleeping-Edge/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sleepingedge-http.log
          exit 1

      - name: Run browser regression suite
        env:
          SLEEPINGEDGE_BASE_URL: http://127.0.0.1:4173/Sleeping-Edge
        run: npx playwright test tests/browser --reporter=line

      - name: Stop local test server
        if: always()
        run: |
          if [ -f /tmp/sleepingedge-http.pid ]; then
            kill "$(cat /tmp/sleepingedge-http.pid)" || true
          fi
