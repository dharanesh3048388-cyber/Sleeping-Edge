name: Validate SleepingEdge static site

on:
  pull_request:
    paths:
      - "static-site/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - ".github/workflows/validate-static-preview.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the existing production app
        run: bun run build

      - name: Validate required pages and assets
        run: |
          set -euo pipefail
          test -s static-site/index.html
          test -s static-site/css/style.css
          test -s static-site/js/main.js
          test -s static-site/js/calculators.js
          for page in sleep-calculator caffeine-calculator nap-calculator sleep-debt-calculator sleep-stages about privacy terms contact; do
            test -s "static-site/$page/index.html"
          done

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check static-site/js/main.js
          node --check static-site/js/calculators.js

      - name: Check local HTML references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path("static-site")
          failures = []
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              # One capture group: each match is the referenced URL.
              for target in re.findall(r'''(?:href|src)=["'](/[^"'#?]*)["']''', html, flags=re.I):
                  rel = target.lstrip("/")
                  if not (root / rel).exists():
                      failures.append(f"{page}: unresolved root path {target}")
          if failures:
              print("\\n".join(failures))
              sys.exit(1)
          print("All root-relative local HTML references resolve within static-site.")
          PY

      - name: Smoke-test GitHub Pages preview packaging
        run: |
          set -euo pipefail
          mkdir -p dist/preview
          cp -R static-site/. dist/preview/
          rm -f dist/preview/robots.txt dist/preview/sitemap.xml dist/preview/_headers
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("dist/preview")
          prefix = "/Sleeping-Edge/preview"
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".css", ".js"}:
                  continue
              content = path.read_text(encoding="utf-8")
              content = re.sub(r'(?i)(href|src|action)=(["\\'])/(?!/)', lambda m: f'{m.group(1)}={m.group(2)}{prefix}/', content)
              content = re.sub(r'url\\((["\\']?)/(?!/)', lambda m: f'url({m.group(1)}{prefix}/', content)
              if path.suffix.lower() == ".html":
                  content = re.sub(r'(?i)</head>', '  <meta name="robots" content="noindex,nofollow">\\n</head>', content, count=1)
              path.write_text(content, encoding="utf-8")
          home = (root / "index.html").read_text(encoding="utf-8")
          assert 'name="robots" content="noindex,nofollow"' in home, "Preview must be noindex"
          assert '"/Sleeping-Edge/preview/' in home, "Preview paths were not rewritten"
          assert (root / "sleep-calculator/index.html").is_file(), "Sleep calculator page missing"
          print("Preview packaging smoke test passed.")
          PY
