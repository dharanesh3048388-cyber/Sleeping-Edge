name: SleepingEdge browser regression tests

on:
  pull_request:
    paths:
      - "src/**"
      - "static-site/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - "playwright.config.*"
      - "tests/**"
      - ".github/workflows/browser-regression.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked project dependencies
        run: bun install --frozen-lockfile

      - name: Build production website
        run: bun run build

      - name: Install isolated browser-test runner
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve production build
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/sleepingedge-http.log 2>&1 &
          echo $! > /tmp/sleepingedge-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/Sleeping-Edge/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sleepingedge-http.log
          exit 1

      - name: Run browser regression suite
        env:
          SLEEPINGEDGE_BASE_URL: http://127.0.0.1:4173/Sleeping-Edge
        run: npx playwright test --reporter=line

      - name: Stop local test server
        if: always()
        run: |
          if [ -f /tmp/sleepingedge-http.pid ]; then
            kill "$(cat /tmp/sleepingedge-http.pid)" || true
          fi
